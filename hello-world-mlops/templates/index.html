<!DOCTYPE html>
<html>
<head>
    <title>Iris Predictor 🌸</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }

        input:focus {
            border-color: #4facfe;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #4facfe;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #007bff;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .loading {
            color: orange;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>🌸 Iris Flower Predictor</h2>

    <input type="number" id="f1" placeholder="Sepal Length">
    <input type="number" id="f2" placeholder="Sepal Width">
    <input type="number" id="f3" placeholder="Petal Length">
    <input type="number" id="f4" placeholder="Petal Width">

    <button onclick="predict()">Predict</button>

    <h3 id="result"></h3>
</div>

<script>
function predict() {
    const result = document.getElementById("result");

    const features = [
        parseFloat(f1.value),
        parseFloat(f2.value),
        parseFloat(f3.value),
        parseFloat(f4.value)
    ];

    if (features.some(isNaN)) {
        result.innerText = "⚠ Please enter all values!";
        result.className = "error";
        return;
    }

    result.innerText = "⏳ Predicting...";
    result.className = "loading";

    fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ features })
    })
    .then(res => res.json())
    .then(data => {
        const labels = ["Setosa 🌼", "Versicolor 🌿", "Virginica 🌸"];
        result.innerText = "Prediction: " + labels[data.prediction];
        result.className = "success";
    })
    .catch(() => {
        result.innerText = "❌ Error connecting to server";
        result.className = "error";
    });
}
</script>

</body>
</html>
