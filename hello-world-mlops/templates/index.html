<!DOCTYPE html>
<html>
<head>
    <title>Iris Prediction</title>
</head>
<body>

<h2>Iris Flower Prediction</h2>

<input type="number" id="f1" placeholder="Sepal Length"><br><br>
<input type="number" id="f2" placeholder="Sepal Width"><br><br>
<input type="number" id="f3" placeholder="Petal Length"><br><br>
<input type="number" id="f4" placeholder="Petal Width"><br><br>

<button onclick="predict()">Predict</button>

<h3 id="result"></h3>

<script>
function predict() {
    const features = [
        parseFloat(f1.value),
        parseFloat(f2.value),
        parseFloat(f3.value),
        parseFloat(f4.value)
    ];

    fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ features })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").innerText =
            "Prediction: " + data.prediction;
    });
}
</script>

</body>
</html>
